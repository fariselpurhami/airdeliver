# Prometheus configuration for the airdeliver compose stack.
# Scrapes the services that actually expose metrics in docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'airdeliver-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: 'traefik'
    metrics_path: /metrics
    static_configs:
      - targets: ['reverse-proxy:8080']

  - job_name: 'rabbitmq'
    metrics_path: /metrics
    static_configs:
      # rabbitmq_prometheus plugin, enabled in the mq service entrypoint
      - targets: ['mq:15692']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
