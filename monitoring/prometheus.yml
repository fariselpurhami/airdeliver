# monitoring/prometheus.yml 

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    metrics_path: '/metrics'
    scrape_interval: 10s
    honor_labels: true        
    static_configs:
      - targets: ['reverse-proxy:8080']

  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'api'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 5s       
    honor_labels: true        
    static_configs:
      - targets: ['api:8000']
