# -------------------------------------------------------------------------
# AIRDELIVER GLOBAL OBSERVABILITY CONFIGURATION
# Standard: Golden Architectural Standard v2.0
# Designed for: Scalability, Federation, and High Availability
# -------------------------------------------------------------------------

global:
  scrape_interval: 15s      
  evaluation_interval: 15s
  scrape_timeout: 10s       
  external_labels:
    environment: 'production'
    region: 'dubai-sandbox'
    cluster: 'drone-ops-alpha'
    monitor: 'main-prometheus'

# Load Alerting Rules 
rule_files:
  # - "alert_rules.yml"

scrape_configs:

  # -------------------------------------------------------
  # 1. Prometheus Self-Monitoring (Meta-Monitoring)
  # -------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # -------------------------------------------------------
  # 2. Core Microservices (The Brain)
  # DNS Service Discovery
  # -------------------------------------------------------
  - job_name: 'airdeliver-api'
    metrics_path: /metrics
    scrape_interval: 5s     
    static_configs:
      - targets: ['api:8000']
    relabel_configs:
      - target_label: service_type
        replacement: core-logic

  - job_name: 'airdeliver-worker'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['api-worker:8000'] 
    relabel_configs:
      - target_label: service_type
        replacement: background-tasks

  - job_name: 'c2-gateway'
    metrics_path: /metrics
    scrape_interval: 2s   
    static_configs:
      - targets: ['c2-gateway:8000']
    relabel_configs:
      - target_label: service_type
        replacement: drone-uplink

  # -------------------------------------------------------
  # 3. Infrastructure & Messaging (The Nervous System)
  # 
  # -------------------------------------------------------
  - job_name: 'rabbitmq'
    metrics_path: /metrics
    static_configs:
      # RabbitMQ Management Plugin exposes metrics on 15692 usually
      - targets: ['mq:15692'] 
    relabel_configs:
      - target_label: layer
        replacement: messaging

  # -------------------------------------------------------
  # 4. Container Stats (The Hardware)
  # 
  # -------------------------------------------------------
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - target_label: layer
        replacement: infrastructure
