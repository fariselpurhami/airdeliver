packages:
  - "frontend/*"
  - "backend/*"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  "@tailwindcss/typography>postcss-selector-parser": "6.1.5"
  "jest-runtime>glob": "14.0.6"
  "test-exclude>glob": "14.0.6"
  "test-exclude>minimatch": "11.0.9"
  "jest-config>glob": "14.0.6"
  "@jest/reporters>glob": "14.0.6"
