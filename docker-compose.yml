# docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: airdeliver-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mq:
    image: rabbitmq:3.13-management-alpine
    container_name: airdeliver-mq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - airdeliver-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: airdeliver-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_HOST=mq
      - RABBITMQ_PORT=5672
      - USE_REDIS=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRONE_JWT_SECRET=${DRONE_JWT_SECRET}
      - ALGORITHM=HS256 
      - API_BASE_URL=http://api:8000/api/v1 
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - api-static-data:/app/static

    depends_on:
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:

       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"] 
       interval: 10s
       timeout: 5s
       retries: 5
       start_period: 10s

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_HOST=mq
      - RABBITMQ_PORT=5672
      - DRONE_JWT_SECRET=${DRONE_JWT_SECRET}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      mq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - airdeliver-net
    
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - airdeliver-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local
  api-static-data:
    driver: local

networks:
  airdeliver-net:
    driver: bridge
    name: airdeliver-net
