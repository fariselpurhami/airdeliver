# docker-compose.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

x-deploy-core: &default-core-deploy
  restart_policy:
    condition: any
    delay: 5s
    window: 120s
  resources:
    limits:
      cpus: '2.0'
      memory: 4G
    reservations:
      cpus: '1.0'
      memory: 2G

x-deploy-app: &default-app-deploy
  restart_policy:
    condition: any
    delay: 5s
    window: 120s
  resources:
    limits:
      cpus: '1.0'
      memory: 1G
    reservations:
      cpus: '0.5'
      memory: 512M

services:
  reverse-proxy:
    image: traefik:v3.0
    container_name: airdeliver-reverse-proxy
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=airdeliver-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt-data:/letsencrypt
    networks:
      - public-net
    restart: always
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.airdeliver.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth,compress-all,security-headers"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASS_HASH}"
      - "traefik.http.middlewares.compress-all.compress=true"
      - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.security-headers.headers.contenttypenosniff=true"

  postgres:
    image: postgres:16-alpine
    container_name: airdeliver-db
    restart: always
    command: postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c maintenance_work_mem=128MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=8 -c max_parallel_workers_per_gather=4 -c max_parallel_workers=8
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging
    deploy: *default-core-deploy

  mq:
    image: rabbitmq:3.13-management-alpine
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_DEFAULT_PASS_FILE=/run/secrets/rabbitmq_pass
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-setcookie ${RABBITMQ_COOKIE:-secretcookie}
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_aliveness"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - backend-net
    logging: *default-logging
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.mq.rule=Host(`mq.airdeliver.com`)"
      - "traefik.http.routers.mq.entrypoints=websecure"
      - "traefik.http.routers.mq.tls.certresolver=letsencrypt"
      - "traefik.http.services.mq.loadbalancer.server.port=15672"
      - "traefik.http.routers.mq.middlewares=auth"

  redis:
    image: redis:7-alpine
    container_name: airdeliver-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 1gb --maxmemory-policy allkeys-lru --io-threads 4 --io-threads-do-reads yes
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy: *default-core-deploy

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging
    deploy: *default-core-deploy

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=mq
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-static-data:/app/static
    depends_on:
      api-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - backend-net
      - public-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 5s
       timeout: 2s
       retries: 10
       start_period: 30s
    command: gunicorn app.main:app -w ${WEB_CONCURRENCY:-8} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --keep-alive 120 --timeout 120
    logging: *default-logging
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.api.rule=Host(`api.airdeliver.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.compress-api.compress=true"
      - "traefik.http.routers.api.middlewares=compress-api,security-headers"

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - HF_HOME=/data/storage/models_cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-storage-data:/data/storage
    depends_on:
      api:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - backend-net
    logging: *default-logging
    deploy: *default-core-deploy
    command: >
      sh -c "mkdir -p /data/storage/models_cache/huggingface &&
             mkdir -p /data/storage/models_cache/sentence_transformers &&
             chown -R airdeliver:airdeliver /data/storage &&
             su -s /bin/sh airdeliver -c \"python /app/worker_entrypoint.py\""

  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    restart: always
    environment:
      - RABBITMQ_HOST=mq
      - API_BASE_URL=http://api:8000/api/v1
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    depends_on:
      mq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend-net
      - public-net
      - simulation-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ws/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 30s
    command: gunicorn app.main:app -w ${WEB_CONCURRENCY:-4} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --keep-alive 60
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.c2.rule=Host(`c2.airdeliver.com`)"
      - "traefik.http.routers.c2.entrypoints=websecure"
      - "traefik.http.routers.c2.tls.certresolver=letsencrypt"
      - "traefik.http.services.c2.loadbalancer.server.port=8001"
      - "traefik.http.routers.c2.middlewares=security-headers"

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
      - NEXTAUTH_URL=https://airdeliver.com
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.web.rule=Host(`airdeliver.com`, `www.airdeliver.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.compress-web.compress=true"
      - "traefik.http.routers.web.middlewares=compress-web,security-headers"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  api-static-data:
  api-storage-data:
  opensearch-data:
  traefik-letsencrypt-data:

networks:
  public-net:
    driver: bridge
    name: airdeliver-public
  backend-net:
    driver: bridge
    internal: true
    name: airdeliver-backend
  simulation-net:
    driver: bridge
    name: airdeliver-simulation

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  postgres_db:
    file: ./secrets/postgres_db
  rabbitmq_user:
    file: ./secrets/rabbitmq_user
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass
  drone_auth_token:
    file: ./secrets/drone_auth_token
