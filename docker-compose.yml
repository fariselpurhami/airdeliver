x-runtime-environment: &runtime-environment
  APP_ENV: "production"
  API_BASE_URL: "${API_BASE_URL:?API_BASE_URL is required}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  REFRESH_SECRET_KEY: "${REFRESH_SECRET_KEY:?REFRESH_SECRET_KEY is required}"
  ALGORITHM: "${ALGORITHM:-HS256}"
  INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}"
  FIRST_SUPERUSER: "${FIRST_SUPERUSER:?FIRST_SUPERUSER is required}"
  FIRST_SUPERUSER_PASSWORD: "${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD is required}"
  VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
  VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
  BEHAVIOR_CHECKPOINT_PATH: "${BEHAVIOR_CHECKPOINT_PATH:-}"
  BEHAVIOR_CHECKPOINT_SHA256: "${BEHAVIOR_CHECKPOINT_SHA256:-}"
  PRODUCT_TEXT_PROFILE: "${PRODUCT_TEXT_PROFILE:-gte-v1}"
  PRODUCT_TEXT_MODEL_REVISION: "${PRODUCT_TEXT_MODEL_REVISION:-}"
  PRODUCT_VISION_MODEL_REVISION: "${PRODUCT_VISION_MODEL_REVISION:-}"
  USE_REDIS: "true"
  COOKIES_SECURE: "${COOKIES_SECURE:-true}"
  LEGACY_TIMESTAMP_TIMEZONE: "${LEGACY_TIMESTAMP_TIMEZONE:-}"
  BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-[\"http://localhost:3000\"]}"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-core-deploy: &default-core-deploy
  restart_policy:
    condition: any
  resources:
    limits:
      memory: 4G
    reservations:
      memory: 1G

x-app-deploy: &default-app-deploy
  restart_policy:
    condition: on-failure
  resources:
    limits:
      memory: 2G
    reservations:
      memory: 512M

services:
  setup-fs:
    image: alpine:3.19
    container_name: airdeliver-setup-fs
    user: root
    command: >
      sh -c "
      mkdir -p /data/storage/models_cache/huggingface &&
      mkdir -p /data/storage/models_cache/sentence_transformers &&
      chown -R 1001:1001 /data/storage
      "
    volumes:
      - api-storage-data:/data/storage
    logging: *default-logging
    deploy:
      restart_policy:
        condition: on-failure

  reverse-proxy:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    container_name: airdeliver-reverse-proxy
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=airdeliver-global-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt-data:/letsencrypt
    networks:
      - global-net
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-global-net"

  loki:
    image: grafana/loki:2.9.2
    container_name: airdeliver-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - global-net
    deploy: *default-core-deploy

  promtail:
    image: grafana/promtail:2.9.2
    container_name: airdeliver-promtail
    volumes:
      - ./monitoring/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - global-net
    deploy: *default-app-deploy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: airdeliver-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - global-net
    deploy: *default-core-deploy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: airdeliver-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - global-net
    deploy: *default-app-deploy
    devices:
      - /dev/kmsg

  grafana:
    image: grafana/grafana:10.2.0
    container_name: airdeliver-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?GRAFANA_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - global-net
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-global-net"
      - "traefik.http.routers.grafana.rule=Host(`monitor.airdeliver.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=auth-monitor"
      - "traefik.http.middlewares.auth-monitor.basicauth.users=${TRAEFIK_DASHBOARD_USER:?TRAEFIK_DASHBOARD_USER is required}:${TRAEFIK_DASHBOARD_PASS_HASH:?TRAEFIK_DASHBOARD_PASS_HASH is required}"

  postgres:
    image: pgvector/pgvector:0.8.7-pg19-bookworm@sha256:89879f41d564f67b0c1462a491d16fcbc6de39ac10db17e7a4bba2138a5e0ba5
    container_name: airdeliver-db
    restart: always
    command: postgres -c shared_buffers=1024MB -c effective_cache_size=3072MB -c maintenance_work_mem=256MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=8 -c max_parallel_workers_per_gather=4 -c max_parallel_workers=8
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db_init/01-enable-vector.sql:/docker-entrypoint-initdb.d/01-enable-vector.sql:ro
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging
    deploy: *default-core-deploy

  postgres-backup:
    build:
      context: ./infra/postgres-backup
    image: airdeliver-postgres-backup:19.0-0.8.7
    container_name: airdeliver-db-backup
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-backups:/backups
    networks:
      - global-net
    depends_on:
      postgres:
        condition: service_healthy

  mq:
    image: rabbitmq:3.13-management
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_COOKIE:?RABBITMQ_COOKIE is required}
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    entrypoint:
      - sh
      - -c
      - |
        export RABBITMQ_DEFAULT_USER=$$(cat /run/secrets/rabbitmq_user)
        export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbitmq_pass)
        rabbitmq-plugins enable --offline rabbitmq_prometheus
        docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy

  redis:
    image: redis:7-bullseye
    container_name: airdeliver-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 1gb --maxmemory-policy allkeys-lru --io-threads 4 --io-threads-do-reads yes
    volumes:
      - redis-data:/data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy: *default-core-deploy

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging
    deploy: *default-core-deploy
  
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: airdeliver-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy

  minio:
    profiles: [legacy-minio]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: airdeliver-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    deploy: *default-app-deploy

  milvus:
    image: milvusdb/milvus:v2.6.17
    container_name: airdeliver-milvus
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -n "$$MINIO_BUCKETNAME" || { echo 'S3_BUCKET_NAME must name a pre-created bucket' >&2; exit 1; }
        test -n "$$MINIO_REGION" || { echo 'S3_REGION is required' >&2; exit 1; }
        case "$$MINIO_ADDRESS" in *.amazonaws.com:443) ;; *) echo 'Production endpoint must be Amazon S3 TLS host:443' >&2; exit 1;; esac
        case "$$MINIO_USEIAM" in true) ;; false) test -n "$$MINIO_ACCESS_KEY_ID" && test -n "$$MINIO_SECRET_ACCESS_KEY" || exit 1;; *) exit 1;; esac
        exec milvus run standalone
    command: []
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus retains minio.* names for all S3-compatible backends, including AWS.
      MINIO_ADDRESS: ${S3_ENDPOINT:-s3.us-east-1.amazonaws.com:443}
      MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MINIO_USESSL: "true"
      MINIO_USEIAM: ${S3_USE_IAM:-true}
      MINIO_CLOUDPROVIDER: aws
      MINIO_REGION: ${S3_REGION:-us-east-1}
      MINIO_BUCKETNAME: ${S3_BUCKET_NAME:-}
      MINIO_ROOTPATH: ${S3_ROOT_PATH:-milvus}
      MINIO_USEVIRTUALHOST: "true"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    deploy: *default-core-deploy

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      <<: *runtime-environment
      POSTGRES_SERVER: "postgres"
      REDIS_HOST: "redis"
      RABBITMQ_HOST: "mq"
      POSTGRES_USER_FILE: "/run/secrets/postgres_user"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
      POSTGRES_DB_FILE: "/run/secrets/postgres_db"
      RABBITMQ_USER_FILE: "/run/secrets/rabbitmq_user"
      RABBITMQ_PASS_FILE: "/run/secrets/rabbitmq_pass"
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global-net
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 125s
    environment:
      <<: *runtime-environment
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      # Optional adapter: missing credentials keep checkout unavailable, never successful.
      STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
      POSTGRES_SERVER: "postgres"
      RABBITMQ_HOST: "mq"
      REDIS_HOST: "redis"
      OPENSEARCH_HOST: "opensearch"
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: "admin"
      OPENSEARCH_PASS: "${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required}"
      POSTGRES_USER_FILE: "/run/secrets/postgres_user"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
      POSTGRES_DB_FILE: "/run/secrets/postgres_db"
      RABBITMQ_USER_FILE: "/run/secrets/rabbitmq_user"
      RABBITMQ_PASS_FILE: "/run/secrets/rabbitmq_pass"
      WEB_CONCURRENCY: "5"
      HF_HOME: "/data/storage/models_cache/huggingface"
      SENTENCE_TRANSFORMERS_HOME: "/data/storage/models_cache/sentence_transformers"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PAYPAL_CHECKOUT_ORIGIN: "${PAYPAL_CHECKOUT_ORIGIN:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_SUPPORT_MODEL: "${GROQ_SUPPORT_MODEL:-openai/gpt-oss-120b}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com}"
      PROVIDER_CAPACITY_PLAN: "${PROVIDER_CAPACITY_PLAN:-free}"
      PROVIDER_PLAN_TPM_LIMIT: "${PROVIDER_PLAN_TPM_LIMIT:-8000}"
      PROVIDER_TPM_HEADROOM_PERCENT: "${PROVIDER_TPM_HEADROOM_PERCENT:-10}"
      GROQ_BRAIN_MODEL: "${GROQ_BRAIN_MODEL:-openai/gpt-oss-120b}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GROQ_VISION_MODEL: "${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      ELEVENLABS_AGENT_ID: "${ELEVENLABS_AGENT_ID:-}"
      PAYPAL_API_BASE_URL: "${PAYPAL_API_BASE_URL:-https://api-m.sandbox.paypal.com}"
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-static-data:/app/static
      - api-storage-data:/data/storage
    depends_on:
      api-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 5s
       timeout: 2s
       retries: 10
       start_period: 390s
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --keep-alive 120 --timeout 120
    logging: *default-logging
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-global-net"
      - "traefik.http.routers.api.rule=Host(`api.airdeliver.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.compress-api.compress=true"
      - "traefik.http.routers.api.middlewares=compress-api,security-headers"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    user: airdeliver
    # Override API image's localhost:8000 health probe for the worker server.
    # Both probes reject cold/failed query embeddings before serving AI work.
    healthcheck:
      test: [CMD, curl, -f, --max-time, '5', http://localhost:8081/health]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 390s
    restart: always
    stop_grace_period: 125s
    env_file: ${AIRDELIVER_ENV_FILE:-.env}
    environment:
      - APP_ENV=production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - BEHAVIOR_CHECKPOINT_PATH=${BEHAVIOR_CHECKPOINT_PATH:-}
      - BEHAVIOR_CHECKPOINT_SHA256=${BEHAVIOR_CHECKPOINT_SHA256:-}
      - PRODUCT_TEXT_PROFILE=${PRODUCT_TEXT_PROFILE:-gte-v1}
      - PRODUCT_TEXT_MODEL_REVISION=${PRODUCT_TEXT_MODEL_REVISION:-}
      - PRODUCT_VISION_MODEL_REVISION=${PRODUCT_VISION_MODEL_REVISION:-}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASS=${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required}
      - MILVUS_URI=http://milvus:19530
      - HF_HOME=/data/storage/models_cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-storage-data:/data/storage
    depends_on:
      setup-fs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy
    command: python /app/worker_entrypoint.py

  web:
    container_name: airdeliver-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: always
    environment:
      - NEXTAUTH_URL=https://airdeliver.com
      - NODE_ENV=production
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-global-net"
      - "traefik.http.routers.web.rule=Host(`airdeliver.com`, `www.airdeliver.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.compress-web.compress=true"
      - "traefik.http.routers.web.middlewares=compress-web,security-headers"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

