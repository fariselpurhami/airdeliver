# file: docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: airdeliver-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airdeliver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airdeliver"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airdeliver
      - USE_REDIS=false # Default to false for local dev
      - REDIS_HOST=redis # If using Redis, add a Redis service
      - REDIS_PORT=6379
      - DRONE_JWT_SECRET=your_super_secret_drone_jwt_key # Add JWT secret
      - ALGORITHM=HS256 # Or your chosen algorithm
      - API_BASE_URL=http://api:8000/api/v1 # For internal calls if needed
      - INTERNAL_API_TOKEN=your_internal_secret_token
    volumes:
      # Mount the named volume to the container's static directory
      - api-static-data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/ws/health || exit 1"] # Point to new health endpoint
       interval: 10s
       timeout: 5s
       retries: 5
       start_period: 30s

  drone-control:
    container_name: airdeliver-drone-control
    build:
      context: ./apps/drone-control
      dockerfile: Dockerfile # Assumes a similar Dockerfile to the main api
    ports:
      - "8001:8000"
    networks:
      - airdeliver-net

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
         # This passes the variable to the build stage
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=a_super_secret_for_nextauth # Change this in production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - airdeliver-net

volumes:
  postgres-data:
    driver: local

  api-static-data:
    driver: local

networks:
  airdeliver-net:
    driver: bridge
    name: airdeliver-net
