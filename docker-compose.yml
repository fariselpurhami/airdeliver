services:
  postgres:
    image: postgres:16-alpine
    container_name: airdeliver-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airdeliver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airdeliver"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airdeliver
      - USE_REDIS=false 
      - REDIS_HOST=redis 
      - REDIS_PORT=6379
      - DRONE_JWT_SECRET=your_super_secret_drone_jwt_key 
      - ALGORITHM=HS256 
      - API_BASE_URL=http://api:8000/api/v1 
      - INTERNAL_API_TOKEN=your_internal_secret_token
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - api-static-data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/ws/health || exit 1"] 
       interval: 10s
       timeout: 5s
       retries: 5
       start_period: 30s

  drone-control:
    container_name: airdeliver-drone-control
    build:
      context: ./apps/drone-control
      dockerfile: Dockerfile 
    ports:
      - "8001:8000"
    networks:
      - airdeliver-net

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=a_super_secret_for_nextauth 
    depends_on:
      api:
        condition: service_healthy
    networks:
      - airdeliver-net

volumes:
  postgres-data:
    driver: local

  api-static-data:
    driver: local

networks:
  airdeliver-net:
    driver: bridge
    name: airdeliver-net
