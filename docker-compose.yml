# docker-compose.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-app: &default-app-deploy
  resources:
    limits:
      cpus: '0.50'
      memory: 512M
    reservations:
      cpus: '0.25'
      memory: 256M

x-deploy-db: &default-db-deploy
  resources:
    limits:
      cpus: '1.0'
      memory: 1G
    reservations:
      cpus: '0.5'
      memory: 512M

services:
  reverse-proxy:
    image: traefik:v3.0
    container_name: airdeliver-reverse-proxy
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt-data:/letsencrypt
    networks:
      - airdeliver-net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.airdeliver.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASS_HASH}"

  postgres:
    image: postgres:16-alpine
    container_name: airdeliver-db
    restart: always
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging
    deploy: *default-db-deploy

  mq:
    image: rabbitmq:3.13-management-alpine
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_DEFAULT_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_aliveness"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - airdeliver-net
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mq.rule=Host(`mq.airdeliver.com`)"
      - "traefik.http.routers.mq.entrypoints=websecure"
      - "traefik.http.routers.mq.tls.certresolver=letsencrypt"
      - "traefik.http.services.mq.loadbalancer.server.port=15672"

  redis:
    image: redis:7-alpine
    container_name: airdeliver-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy: *default-app-deploy

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=mq
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airdeliver-net
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-static-data:/app/static
    depends_on:
      api-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 10s
       timeout: 10s
       retries: 5
       start_period: 60s
    command: gunicorn app.main:app -w ${WEB_CONCURRENCY:-4} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.airdeliver.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    restart: always
    environment:
      - RABBITMQ_HOST=mq
      - API_BASE_URL=http://api:8000/api/v1
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    depends_on:
      mq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ws/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn app.main:app -w ${WEB_CONCURRENCY:-2} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.c2.rule=Host(`c2.airdeliver.com`)"
      - "traefik.http.routers.c2.entrypoints=websecure"
      - "traefik.http.routers.c2.tls.certresolver=letsencrypt"
      - "traefik.http.services.c2.loadbalancer.server.port=8001"

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
      - NEXTAUTH_URL=https://airdeliver.com
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - airdeliver-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`airdeliver.com`, `www.airdeliver.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  api-static-data:
  traefik-letsencrypt-data:

networks:
  airdeliver-net:
    driver: bridge
    name: airdeliver-net

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  postgres_db:
    file: ./secrets/postgres_db
  rabbitmq_user:
    file: ./secrets/rabbitmq_user
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass

  drone_auth_token:
    file: ./secrets/drone_auth_token
