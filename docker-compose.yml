
# --- 🏗️ GLOBAL ARCHITECTURAL ANCHORS ---

# 1. Standard Logging Policy
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# 2. Core Infrastructure Policy (High Availability)
x-core-deploy: &default-core-deploy
  restart_policy:
    condition: any
  resources:
    limits:
      memory: 4G
    reservations:
      memory: 1G

# 3. Application Logic Policy (Fault Tolerance)
x-app-deploy: &default-app-deploy
  restart_policy:
    condition: on-failure
  resources:
    limits:
      memory: 2G
    reservations:
      memory: 512M

# --- SERVICES ---

services:
  setup-fs:
    image: alpine:3.19
    container_name: airdeliver-setup-fs
    user: root
    command: >
      sh -c "
      mkdir -p /data/storage/models_cache/huggingface &&
      mkdir -p /data/storage/models_cache/sentence_transformers &&
      chown -R 1001:1001 /data/storage
      "
    volumes:
      - api-storage-data:/data/storage
    logging: *default-logging
    deploy:
      restart_policy:
        condition: on-failure

  reverse-proxy:
    image: traefik:v3.0
    container_name: airdeliver-reverse-proxy
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=airdeliver-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt-data:/letsencrypt
    networks:
      - global-net
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"

  loki:
    image: grafana/loki:2.9.2
    container_name: airdeliver-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - global-net
    deploy: *default-core-deploy

  promtail:
    image: grafana/promtail:2.9.2
    container_name: airdeliver-promtail
    volumes:
      - ./monitoring/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - global-net
    deploy: *default-app-deploy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: airdeliver-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - global-net
    deploy: *default-core-deploy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: airdeliver-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - global-net
    deploy: *default-app-deploy
    devices:
      - /dev/kmsg

  grafana:
    image: grafana/grafana:10.2.0
    container_name: airdeliver-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - global-net
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.grafana.rule=Host(`monitor.airdeliver.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=auth-monitor"
      - "traefik.http.middlewares.auth-monitor.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASS_HASH}"

  postgres:
    image: postgres:16-bullseye
    container_name: airdeliver-db
    restart: always
    command: postgres -c shared_buffers=1024MB -c effective_cache_size=3072MB -c maintenance_work_mem=256MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=8 -c max_parallel_workers_per_gather=4 -c max_parallel_workers=8
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging
    deploy: *default-core-deploy

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: airdeliver-db-backup
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres-backups:/backups
    networks:
      - global-net
    depends_on:
      postgres:
        condition: service_healthy

  mq:
    image: rabbitmq:3.13-management
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_COOKIE:-secretcookie}
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    entrypoint:
      - sh
      - -c
      - |
        export RABBITMQ_DEFAULT_USER=$(cat /run/secrets/rabbitmq_user)
        export RABBITMQ_DEFAULT_PASS=$(cat /run/secrets/rabbitmq_pass)
        docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy

  redis:
    image: redis:7-bullseye
    container_name: airdeliver-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 1gb --maxmemory-policy allkeys-lru --io-threads 4 --io-threads-do-reads yes
    volumes:
      - redis-data:/data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy: *default-core-deploy

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-REMOVED_COMMITTED_SECRET}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging
    deploy: *default-core-deploy
  
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: airdeliver-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: airdeliver-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    deploy: *default-app-deploy

  milvus:
    image: milvusdb/milvus:v2.3.13
    container_name: airdeliver-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    deploy: *default-core-deploy

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=mq
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global-net
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 125s
    environment:
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-REMOVED_COMMITTED_SECRET}
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - WEB_CONCURRENCY=5
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-static-data:/app/static
    depends_on:
      api-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 5s
       timeout: 2s
       retries: 10
       start_period: 30s
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --keep-alive 120 --timeout 120
    logging: *default-logging
    deploy: *default-core-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.api.rule=Host(`api.airdeliver.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.compress-api.compress=true"
      - "traefik.http.routers.api.middlewares=compress-api,security-headers"

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    user: airdeliver
    restart: always
    stop_grace_period: 125s
    environment:
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-REMOVED_COMMITTED_SECRET}
      - MILVUS_URI=http://milvus:19530
      - HF_HOME=/data/storage/models_cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      # Secrets from .env will be passed automatically by Docker Compose
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_pass
    volumes:
      - api-storage-data:/data/storage
    depends_on:
      setup-fs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - global-net
    logging: *default-logging
    deploy: *default-core-deploy
    command: python /app/worker_entrypoint.py

  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 70s
    environment:
      - RABBITMQ_HOST=mq
      - API_BASE_URL=http://api:8000/api/v1
      - RABBITMQ_USER_FILE=/run/secrets/rabbitmq_user
      - RABBITMQ_PASS_FILE=/run/secrets/rabbitmq_pass
      - WEB_CONCURRENCY=3
    secrets:
      - rabbitmq_user
      - rabbitmq_pass
    depends_on:
      mq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ws/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 30s
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --keep-alive 60
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.c2.rule=Host(`c2.airdeliver.com`)"
      - "traefik.http.routers.c2.entrypoints=websecure"
      - "traefik.http.routers.c2.tls.certresolver=letsencrypt"
      - "traefik.http.services.c2.loadbalancer.server.port=8001"
      - "traefik.http.routers.c2.middlewares=security-headers"

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
      - NEXTAUTH_URL=https://airdeliver.com
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy: *default-app-deploy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=airdeliver-public"
      - "traefik.http.routers.web.rule=Host(`airdeliver.com`, `www.airdeliver.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.compress-web.compress=true"
      - "traefik.http.routers.web.middlewares=compress-web,security-headers"

volumes:
  postgres-data:
  postgres-backups:
  rabbitmq-data:
  redis-data:
  api-static-data:
  api-storage-data:
  opensearch-data:
  traefik-letsencrypt-data:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  global-net:
    name: airdeliver-global-net
    external: true

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  postgres_db:
    file: ./secrets/postgres_db
  rabbitmq_user:
    file: ./secrets/rabbitmq_user
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass
  drone_auth_token:
    file: ./secrets/drone_auth_token
