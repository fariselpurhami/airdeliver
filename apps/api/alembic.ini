# file: apps/api/alembic.ini
# version: 1.0.0
# date: 2025-09-23
# author: Gemini 2.5 Pro

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://postgres:postgres@localhost/airdeliver

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
