[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "Backend API for airdeliver"
authors = ["Faris Elpurhami"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlmodel = "0.0.20"
SQLAlchemy = "^2.0"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg = {extras = ["binary"], version = "^3.1.19"}
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.2.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "3.2.2"
python-multipart = "^0.0.9"
tenacity = "^8.3.0"
starlette-prometheus = "^0.10.0"
slowapi = "^0.1.9"
pywebpush = "^1.14.0"
stripe = "^10.1.0"
httpx = ">=0.28.1"
prometheus-fastapi-instrumentator = "^7.1.0"
redis = "^7.0.1"
python-jose = {version = "3.5.0", extras = ["cryptography"]}
packaging = "23.1"
certifi = "2023.7.22"
pydantic = {version = "^2.12.3", extras = ["email"]}
aio-pika = "^9.4.1"
structlog = "^24.3.0"
opensearch-py = "==2.4.2"
aiohttp = "^3.9.5"
sentence-transformers = "^5.1.2"
milvus-lite = "^2.4.1"
pymilvus = "^2.4.1"
groq = "^0.37.0"
torch = "2.2.2"
numpy = "<2.0.0"
transformers = "^4.57.3"
ujson = "^5.11.0"
python-dotenv = "^1.2.1"
ddgs = "^9.9.2"
duckduckgo-search = "^8.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
trio = "^0.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
