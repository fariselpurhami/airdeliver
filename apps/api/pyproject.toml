[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "airdeliver-API"
authors = ["airdeliver Holding"]
packages = [
    {include = "app"},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.124.0"
uvicorn = {version = "^0.38.0", extras = ["standard"]}
sqlmodel = "^0.0.27"
SQLAlchemy = "^2.0"
alembic = "^1.13.1"
asyncpg = "^0.31.0"
psycopg = "^3.3.2"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.2.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "3.2.2"
python-multipart = "^0.0.20"
tenacity = "^9.1.2"
starlette-prometheus = "^0.10.0"
slowapi = "^0.1.9"
pywebpush = "^1.14.0"
stripe = "^10.1.0"
httpx = ">=0.28.1"
prometheus-fastapi-instrumentator = "^7.1.0"
redis = "^7.0.1"
python-jose = {version = "3.5.0", extras = ["cryptography"]}
packaging = "23.1"
certifi = "^2025.11.12"
pydantic = {version = "^2.12.3", extras = ["email"]}
aio-pika = "^9.4.1"
structlog = "^25.5.0"
opensearch-py = "==2.4.2"
aiohttp = "^3.9.5"
sentence-transformers = "^5.1.2"
milvus-lite = "^2.4.1"
pymilvus = "^2.4.1"
groq = "^0.37.1"
torch = "2.2.2"
numpy = "<2.0.0"
transformers = "^4.57.3"
ujson = "^5.11.0"
python-dotenv = "^1.2.1"
duckduckgo-search = "^8.1.1"
orjson = "^3.11.5"
urllib3 = "^2.6.0"
anyio = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
trio = "^0.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
