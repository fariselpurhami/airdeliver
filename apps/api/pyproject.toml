[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "airdeliver-API"
authors = ["airdeliver Holding"]
packages = [
    {include = "app"},
]

# 🛑 CRITICAL ARCHITECTURAL FIX: Source must be defined before dependencies
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.13.14"

# --- CORE FRAMEWORK ---

fastapi = "^0.139.0"
uvicorn = {version = "^0.50.0", extras = ["standard"]}
pydantic = {version = "^2.13.4", extras = ["email"]}
pydantic-settings = "2.14.2"
starlette-prometheus = "0.10.0"
prometheus-fastapi-instrumentator = "8.0.2"
slowapi = "^0.1.10"

# --- DATABASE & ORM ---
sqlmodel = "^0.0.39"
sqlalchemy = "^2.0.51"
alembic = "^1.18.5"
asyncpg = "^0.31.0"
psycopg = "^3.3.4"
psycopg2-binary = "^2.9.12"
pgvector = "^0.4.2"
redis = "8.0.1" # FROZEN: v8.0.0 introduces breaking changes
pymilvus = "^3.0.0" # FROZEN: v3.0.0 introduces breaking changes
opensearch-py = "^3.2.0"

# --- INFRASTRUCTURE & UTILS ---
aio-pika = "^9.6.2"
aiohttp = "^3.14.1"
anyio = "^4.14.1"
urllib3 = "^2.7.0"
requests = "^2.34.2"
httpx = "^0.28.1"
python-multipart = "0.0.32"
tenacity = "^9.1.4"
structlog = "^26.1.0"
ujson = "^5.13.0"
orjson = "^3.11.9"
python-dotenv = "^1.2.2"
packaging = "26.2"
certifi = "^2026.6.17"
watchfiles = "^1.2.0"
psutil = "7.2.2"

# --- SECURITY & AUTH ---
bcrypt = "^5.0.0"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
python-jose = {version = "3.5.0", extras = ["cryptography"]}

# --- 3RD PARTY INTEGRATIONS ---
stripe = "^15.3.1" # FROZEN: v15.2.0 contains Stripe API breaking changes
pywebpush = "^2.3.0"
groq = "^1.6.0"
ddgs = "^9.14.4"
tavily-python = "^0.7.26"

# --- MACHINE LEARNING & AI ---
# 🛑 PINNED TO EXPLICIT CPU SOURCE TO PREVENT RESOLVER CRASH & BLOAT
torch = ">=2.4.0"
torchvision = [
    {version = "0.21.0", markers = "sys_platform == 'darwin'"},
    {version = "0.21.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'"}
]
torchaudio = [
    {version = "2.6.0", markers = "sys_platform == 'darwin'"},
    {version = "2.6.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'"}
]
numpy = "2.5.1"
transformers = "5.14.1"
sentence-transformers = "5.6.1"
sentencepiece = "^0.2.1"
accelerate = "^1.14.0"
huggingface-hub = "1.25.1"
pillow = "^12.3.0"

# --- DEV TOOLS ---
faker = "^40.19.1"
faker-commerce = "1.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
trio = "^0.33.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
