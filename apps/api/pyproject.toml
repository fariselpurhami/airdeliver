[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "airdeliver-API"
authors = ["airdeliver Holding"]
packages = [
    {include = "app"},
]

# 🛑 CRITICAL ARCHITECTURAL FIX: Source must be defined before dependencies
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11.9"

# --- CORE FRAMEWORK ---
fastapi = "^0.136.3"
uvicorn = {version = "^0.48.0", extras = ["standard"]}
pydantic = {version = "^2.13.4", extras = ["email"]}
pydantic-settings = "^2.14.1"
starlette-prometheus = "^0.10.0"
prometheus-fastapi-instrumentator = "^7.1.0" # FROZEN: v8.0.0 introduces breaking changes
slowapi = "^0.1.9"

# --- DATABASE & ORM ---
sqlmodel = "^0.0.38"
sqlalchemy = "^2.0.50"
alembic = "^1.18.4"
asyncpg = "^0.31.0"
psycopg = "^3.3.4"
psycopg2-binary = "^2.9.12"
pgvector = "^0.4.2"
redis = "^7.3.0" # FROZEN: v8.0.0 introduces breaking changes
pymilvus = "^2.6.9" # FROZEN: v3.0.0 introduces breaking changes
opensearch-py = "^3.2.0"

# --- INFRASTRUCTURE & UTILS ---
aio-pika = "^9.6.2"
aiohttp = "^3.13.5"
anyio = "^4.13.0"
urllib3 = "^2.7.0"
requests = "^2.34.2"
httpx = "^0.28.1"
python-multipart = "^0.0.29"
tenacity = "^9.1.4"
structlog = "^25.5.0"
ujson = "^5.12.1"
orjson = "^3.11.9"
python-dotenv = "^1.2.2"
packaging = "26.2"
certifi = "^2026.5.20"
watchfiles = "^1.2.0"
psutil = "7.2.2"

# --- SECURITY & AUTH ---
bcrypt = "^5.0.0"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
python-jose = {version = "3.5.0", extras = ["cryptography"]}

# --- 3RD PARTY INTEGRATIONS ---
stripe = "^14.4.1" # FROZEN: v15.2.0 contains Stripe API breaking changes
pywebpush = "^2.3.0"
groq = "^1.4.0"
ddgs = "^9.14.4"
tavily-python = "^0.7.25"

# --- MACHINE LEARNING & AI ---
# 🛑 PINNED TO EXPLICIT CPU SOURCE TO PREVENT RESOLVER CRASH & BLOAT
torch = ">=2.4.0"
torchvision = [
    {version = "0.21.0", markers = "sys_platform == 'darwin'"},
    {version = "0.21.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'"}
]
torchaudio = [
    {version = "2.6.0", markers = "sys_platform == 'darwin'"},
    {version = "2.6.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'"}
]
numpy = "^2.4.6"
transformers = ">=4.44.0"
sentence-transformers = "^5.5.1"
sentencepiece = "^0.2.1"
accelerate = "^1.13.0"
huggingface-hub = "^1.17.0"
pillow = "^12.2.0"

# --- DEV TOOLS ---
faker = "^40.19.1"
faker-commerce = "1.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
trio = "^0.33.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
