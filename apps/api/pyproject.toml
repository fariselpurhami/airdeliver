# apps/api/pyproject.toml

[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "Backend API for airdeliver"
authors = ["Faris Elpurhami"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlmodel = "0.0.20"
SQLAlchemy = "^2.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.2.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "3.2.2"
python-multipart = "^0.0.9"
tenacity = "^8.3.0"
starlette-prometheus = "^0.10.0"
slowapi = "^0.1.9"
pywebpush = "^1.14.0"
stripe = "^10.1.0"
httpx = "<0.28.0"
prometheus-fastapi-instrumentator = "^7.1.0"
redis = "^7.0.1"
python-jose = {version = "3.5.0", extras = ["cryptography"]}
packaging = "23.1"
certifi = "2023.7.22"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0" 
alembic = "^1.16.5"
trio = "^0.31.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
