[tool.poetry]
name = "airdeliver-api"
version = "1.0.0"
description = "airdeliver-API"
authors = ["airdeliver Holding"]
packages = [
    {include = "app"},
]

[tool.poetry.dependencies]
python = "^3.11.9"
fastapi = "^0.128.0"
uvicorn = {version = "^0.40.0", extras = ["standard"]}
sqlmodel = "^0.0.31"
sqlalchemy = "^2.0"
alembic = "^1.13.1"
asyncpg = "^0.31.0"
psycopg = "^3.3.2"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.2.1"
bcrypt = "^5.0.0"
python-multipart = "^0.0.21"
tenacity = "^9.1.2"
starlette-prometheus = "^0.10.0"
slowapi = "^0.1.9"
pywebpush = "^2.2.0"
stripe = "^14.1.0"
httpx = ">=0.28.1"
prometheus-fastapi-instrumentator = "^7.1.0"
redis = "^7.0.1"
python-jose = {version = "3.5.0", extras = ["cryptography"]}
packaging = "25.0"
certifi = "^2026.1.4"
pydantic = {version = "^2.12.3", extras = ["email"]}
aio-pika = "^9.4.1"
structlog = "^25.5.0"
opensearch-py = "^3.1.0"
aiohttp = "^3.13.3"
sentence-transformers = "^5.2.0"
sentencepiece = "^0.2.0"
accelerate = "^1.2.0"
pymilvus = "^2.6.6"
groq = "^1.0.0"
torch = {version = "2.6.0", source = "pytorch"}
torchvision = {version = "0.21.0", source = "pytorch"}
numpy = "^2.4.0"
transformers = "^4.57.3"
ujson = "^5.11.0"
python-dotenv = "^1.2.1"
ddgs = "^9.10.0"
orjson = "^3.11.5"
urllib3 = "^2.6.2"
anyio = "^4.12.0"
pillow = "^12.1.0"
requests = "^2.32.5"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
huggingface-hub = "^0.36.0"
faker = "^40.1.0"
faker-commerce = "1.0.4"
pgvector = "^0.4.2"
tavily-python = "^0.7.17"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
trio = "^0.32.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
