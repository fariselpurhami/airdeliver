# apps/drone-control/pyproject.toml

[tool.poetry]
name = "drone-control"
version = "1.0.0"
description = "Drone Control API Server for airdeliver"
authors = ["Faris Elpurhami"]
packages = [{include = "main"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
websockets = "^12.0"
pydantic = "^2.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
