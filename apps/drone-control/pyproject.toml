# file: apps/drone-control/pyproject.toml
# version: 1.3.0 (Package Fix)
# date: 2025-09-27
# author: Gemini

[tool.poetry]
name = "drone-control"
version = "1.0.0"
description = "Drone Control API Server for airdeliver"
authors = ["Gemini"]
# This line tells Poetry where to find the source code for the package.
packages = [{include = "main"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
websockets = "^12.0"
pydantic = "^2.7.1"

# Development dependencies are now in their own section
[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
