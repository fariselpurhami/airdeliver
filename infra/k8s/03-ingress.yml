# infra/k8s/03-ingress.yml
# Traefik IngressClass, consistent with the docker-compose edge proxy.
# Requires the Traefik ingress controller installed in the cluster
# (helm install traefik traefik/traefik). Replace hosts with real domains.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airdeliver-ingress
  namespace: airdeliver
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: airdeliver-airdeliver-rate-limit@kubernetescrd,airdeliver-airdeliver-inflight-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.airdeliver.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
    - host: airdeliver.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
  tls:
    - hosts:
        - api.airdeliver.com
        - airdeliver.com
      secretName: airdeliver-tls
