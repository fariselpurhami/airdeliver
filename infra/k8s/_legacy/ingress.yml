apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airdeliver-ingress
  namespace: airdeliver
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - airdeliver.com
    secretName: airdeliver-tls
  rules:
  - host: airdeliver.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: airdeliver-api-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: airdeliver-web-service
            port:
              number: 3000
