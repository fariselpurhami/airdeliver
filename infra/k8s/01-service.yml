# infra/k8s/01-service.yml

apiVersion: v1
kind: Service
metadata:
  name: airdeliver-api-service
  namespace: airdeliver
  labels:
    app: airdeliver-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/api/v1/metrics"
spec:
  type: ClusterIP 
  selector:
    app: airdeliver-api
  ports:
    - name: http
      port: 80       
      targetPort: 8000 
      protocol: TCP
  sessionAffinity: None
