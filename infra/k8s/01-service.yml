# infra/k8s/01-service.yml
# ClusterIP services for the API and web frontends.

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: airdeliver
  labels:
    app: airdeliver-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: airdeliver-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: airdeliver
  labels:
    app: airdeliver-web
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: airdeliver-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
