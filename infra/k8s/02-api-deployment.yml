# infra/k8s/02-api-deployment.yml
# FastAPI app (gunicorn + uvicorn workers) with migration initContainer and HPA.
# Websocket fan-out across replicas is safe: UI frames travel via the Redis
# airdeliver:response:{user_id} relay (app/main.py), not in-process state.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airdeliver-api
  namespace: airdeliver
  labels:
    app: airdeliver-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: airdeliver-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: airdeliver-api
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: airdeliver-api
      initContainers:
        - name: api-migrator
          image: yourregistry/airdeliver-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: airdeliver-config
            - secretRef:
                name: airdeliver-secrets
      containers:
        - name: api
          image: yourregistry/airdeliver-api:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
                    "-b", "0.0.0.0:8000", "--keep-alive", "120", "--timeout", "120"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: airdeliver-config
            - secretRef:
                name: airdeliver-secrets
          env:
            - name: WEB_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /data/storage
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: airdeliver-model-cache
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airdeliver-api-hpa
  namespace: airdeliver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airdeliver-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
