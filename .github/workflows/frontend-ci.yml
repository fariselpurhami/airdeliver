# .github/workflows/frontend-ci.yml

name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/web/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter airdeliver/apps/web exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter airdeliver/apps/web exec jest --coverage=false

      - name: Build
        run: pnpm --filter airdeliver/apps/web build
