# .github/workflows/frontend-ci.yml

name: Frontend CI

on:
  push:
    branches: ["refactor/service-domain-ownership", "refactor/provider-capacity-domain", "refactor/script-ownership", "refactor/docs-ownership", "refactor/frontend-backend-boundaries", "refactor/infra-layout-stage", "build/canonical-workspace-lock", "chore/generated-cache-cleanup", "fix/admin-operations-labels", "fix/paid-admission-resource-failures", "test/paid-capacity-burst-faults", "feat/capacity-operator-snapshot", "feat/provider-observed-capacity", "feat/paid-scale-admission", "feat/safe-owner-capacity-trace", "feat/configured-provider-capacity", "fix/payment-outbox-reconciliation", "fix/currency-aware-dashboard", "test/whole-chain-capacity", "perf/router-contract-compaction", "perf/reviewed-chain-contracts", "feat/human-fallback-voice", "fix/compact-reviewed-inference", "main", "hardening/cart-ui-mutation-outcomes", "hardening/customer-memory-controls-ui", "hardening/unknown-price-ui", "hardening/revisioned-cart-ui", "hardening/cart-ui-snapshot-validation", "hardening/catalog-price-ui-consistency"]
    paths:
      - 'scripts/**'
      - 'frontend/**'
      - 'backend/**'
      - 'apps/api'
      - 'apps/web'
      - 'infra/observability/**'
      - 'infra/database/**'
      - 'backend/api/tests/test_infra_layout_paths.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - 'backend/api/tests/test_canonical_web_workspace.py'
      - 'docs/verification/generated-cache-cleanup-v1*'
      - 'backend/api/tests/test_generated_cache_hygiene.py'
      - 'frontend/web/**'
      - 'backend/api/app/services/compact_copy_contracts.py'
      - 'backend/api/app/services/compact_router_contract.py'
      - 'backend/api/tests/test_whole_chain_capacity.py'
      - 'backend/api/app/services/admin_metrics.py'
      - 'backend/api/app/services/payment_outbox_reconciler.py'
      - 'backend/api/app/core/config.py'
      - 'scripts/ops/safe_provider_trace.py'
      - 'backend/api/app/services/shared_provider_admission.py'
      - 'backend/api/app/services/paid_turn_admission.py'
      - 'backend/api/app/services/provider_response_observation.py'
      - 'backend/api/app/services/provider_usage_meter.py'
      - 'backend/api/app/services/provider_capacity_snapshot.py'
      - 'backend/api/tests/test_paid_capacity_burst_faults.py'
      - '.github/workflows/secret-history-guard.yml'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - 'frontend/**'
      - 'backend/**'
      - 'apps/api'
      - 'apps/web'
      - 'infra/observability/**'
      - 'infra/database/**'
      - 'backend/api/tests/test_infra_layout_paths.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - 'backend/api/tests/test_canonical_web_workspace.py'
      - 'docs/verification/generated-cache-cleanup-v1*'
      - 'backend/api/tests/test_generated_cache_hygiene.py'
      - 'frontend/web/**'
      - 'backend/api/app/services/compact_copy_contracts.py'
      - 'backend/api/app/services/compact_router_contract.py'
      - 'backend/api/tests/test_whole_chain_capacity.py'
      - 'backend/api/app/services/admin_metrics.py'
      - 'backend/api/app/services/payment_outbox_reconciler.py'
      - 'backend/api/app/core/config.py'
      - 'scripts/ops/safe_provider_trace.py'
      - 'backend/api/app/services/shared_provider_admission.py'
      - 'backend/api/app/services/paid_turn_admission.py'
      - 'backend/api/app/services/provider_response_observation.py'
      - 'backend/api/app/services/provider_usage_meter.py'
      - 'backend/api/app/services/provider_capacity_snapshot.py'
      - 'backend/api/tests/test_paid_capacity_burst_faults.py'
      - '.github/workflows/secret-history-guard.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Private LAN development policy
        run: node --test frontend/web/scripts/check-dev-lan-policy.mjs

      - name: Scoped security dependency contracts
        run: pnpm --filter airdeliver/apps/web exec node scripts/check-security-dependency-contracts.cjs

      - name: Typecheck
        run: pnpm --filter airdeliver/apps/web exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter airdeliver/apps/web exec jest --coverage=false

      - name: Build
        # AUTH_SECRET is required at module load by auth.ts during next build's
        # page-data collection. This is a build-time-only dummy; production
        # injects the real secret at runtime.
        env:
          AUTH_SECRET: ci-build-dummy-secret-not-used-at-runtime
        run: pnpm --filter airdeliver/apps/web build

      - name: Verify isolated canonical workspace lock and install
        timeout-minutes: 12
        run: |
          standalone=$(mktemp -d)
          mkdir -p "$standalone/frontend/web"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml .pnpmfile.cjs "$standalone/"
          tar -C frontend/web --exclude=node_modules --exclude=.next --exclude=tsconfig.tsbuildinfo -cf - . | tar -C "$standalone/frontend/web" -xf -
          cd "$standalone"
          pnpm install --frozen-lockfile
          pnpm --filter airdeliver/apps/web exec node scripts/check-security-dependency-contracts.cjs
          pnpm --filter airdeliver/apps/web exec tsc --noEmit
          pnpm --filter airdeliver/apps/web exec jest --coverage=false --runInBand
          AUTH_SECRET=ci-build-dummy-secret-not-runtime pnpm --filter airdeliver/apps/web build

  docker-workspace-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build existing development interface from canonical workspace
        run: docker build -f frontend/web/Dockerfile --target development -t airdeliver-web-dev-ci .
      - name: Resolve locked dependencies from the existing dev mount path
        run: docker run --rm --entrypoint node airdeliver-web-dev-ci -e "for (const name of ['next','react','next-auth','sharp']) console.log(name, require.resolve(name));"
      - name: Build standalone production runner from same frozen graph
        run: docker build -f frontend/web/Dockerfile --target runner -t airdeliver-web-run-ci .
      - name: Verify standalone runner without API or provider traffic
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name web-workspace-smoke -p 127.0.0.1:3100:3000 -e AUTH_SECRET=offline-runtime-test-only-not-a-user-secret airdeliver-web-run-ci
          trap 'docker logs web-workspace-smoke; docker rm -f web-workspace-smoke' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/logo.png; then exit 0; fi
            sleep 2
          done
          exit 1
