# .github/workflows/frontend-ci.yml

name: Frontend CI

on:
  push:
    branches: ["main", "hardening/cart-ui-mutation-outcomes", "hardening/customer-memory-controls-ui", "hardening/unknown-price-ui", "hardening/revisioned-cart-ui", "hardening/cart-ui-snapshot-validation", "hardening/catalog-price-ui-consistency"]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/web/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Private LAN development policy
        run: node --test apps/web/scripts/dev-lan-policy.test.mjs

      - name: Typecheck
        run: pnpm --filter airdeliver/apps/web exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter airdeliver/apps/web exec jest --coverage=false

      - name: Build
        # AUTH_SECRET is required at module load by auth.ts during next build's
        # page-data collection. This is a build-time-only dummy; production
        # injects the real secret at runtime.
        env:
          AUTH_SECRET: ci-build-dummy-secret-not-used-at-runtime
        run: pnpm --filter airdeliver/apps/web build
