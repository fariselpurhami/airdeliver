# .github/workflows/frontend-ci.yml

name: Frontend CI

on:
  push:
    branches: ["feat/paid-scale-admission", "feat/safe-owner-capacity-trace", "feat/configured-provider-capacity", "fix/payment-outbox-reconciliation", "fix/currency-aware-dashboard", "test/whole-chain-capacity", "perf/router-contract-compaction", "perf/reviewed-chain-contracts", "feat/human-fallback-voice", "fix/compact-reviewed-inference", "main", "hardening/cart-ui-mutation-outcomes", "hardening/customer-memory-controls-ui", "hardening/unknown-price-ui", "hardening/revisioned-cart-ui", "hardening/cart-ui-snapshot-validation", "hardening/catalog-price-ui-consistency"]
    paths:
      - 'apps/web/**'
      - 'apps/api/app/services/compact_copy_contracts.py'
      - 'apps/api/app/services/compact_router_contract.py'
      - 'apps/api/tests/test_whole_chain_capacity.py'
      - 'apps/api/app/services/admin_metrics.py'
      - 'apps/api/app/services/payment_outbox_reconciler.py'
      - 'apps/api/app/core/config.py'
      - 'scripts/safe_provider_trace.py'
      - 'apps/api/app/services/shared_provider_admission.py'
      - 'apps/api/app/services/paid_turn_admission.py'
      - '.github/workflows/secret-history-guard.yml'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/web/**'
      - 'apps/api/app/services/compact_copy_contracts.py'
      - 'apps/api/app/services/compact_router_contract.py'
      - 'apps/api/tests/test_whole_chain_capacity.py'
      - 'apps/api/app/services/admin_metrics.py'
      - 'apps/api/app/services/payment_outbox_reconciler.py'
      - 'apps/api/app/core/config.py'
      - 'scripts/safe_provider_trace.py'
      - 'apps/api/app/services/shared_provider_admission.py'
      - 'apps/api/app/services/paid_turn_admission.py'
      - '.github/workflows/secret-history-guard.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Private LAN development policy
        run: node --test apps/web/scripts/check-dev-lan-policy.mjs

      - name: Scoped security dependency contracts
        run: pnpm --filter airdeliver/apps/web exec node scripts/check-security-dependency-contracts.cjs

      - name: Typecheck
        run: pnpm --filter airdeliver/apps/web exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter airdeliver/apps/web exec jest --coverage=false

      - name: Build
        # AUTH_SECRET is required at module load by auth.ts during next build's
        # page-data collection. This is a build-time-only dummy; production
        # injects the real secret at runtime.
        env:
          AUTH_SECRET: ci-build-dummy-secret-not-used-at-runtime
        run: pnpm --filter airdeliver/apps/web build

      - name: Verify standalone Docker-context lock and install
        timeout-minutes: 12
        run: |
          standalone=$(mktemp -d)
          tar -C apps/web --exclude=node_modules --exclude=.next --exclude=tsconfig.tsbuildinfo -cf - . | tar -C "$standalone" -xf -
          cd "$standalone"
          pnpm install --frozen-lockfile
          node scripts/check-security-dependency-contracts.cjs
          pnpm exec tsc --noEmit
          pnpm exec jest --coverage=false --runInBand
          AUTH_SECRET=ci-build-dummy-secret-not-runtime pnpm build
