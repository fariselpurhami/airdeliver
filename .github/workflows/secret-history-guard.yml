name: Secret history guard
on:
  push:
    branches: ["fix/compact-reviewed-inference", main, hardening/secret-history-guard]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable history without printing values
        run: /tmp/gitleaks git --log-opts="--all --full-history" --ignore-gitleaks-allow --redact=100 --no-banner .
