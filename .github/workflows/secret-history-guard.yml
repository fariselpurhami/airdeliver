name: Secret history guard
on:
  push:
    branches: ["security/jwt-required-expiry", "security/untrusted-context-boundary", "security/support-log-boundary", "hardening/provider-quota-axes", "hardening/dev-migration-opt-in", "tooling/dev-volume-reconciliation", "refactor/frontend-backend-boundaries", "refactor/infra-layout-stage", "build/canonical-workspace-lock", "chore/generated-cache-cleanup", "fix/admin-operations-labels", "fix/paid-admission-resource-failures", "test/paid-capacity-burst-faults", "feat/capacity-operator-snapshot", "feat/provider-observed-capacity", "feat/paid-scale-admission", "feat/safe-owner-capacity-trace", "feat/configured-provider-capacity", "fix/payment-outbox-reconciliation", "fix/currency-aware-dashboard", "test/whole-chain-capacity", "perf/router-contract-compaction", "perf/reviewed-chain-contracts", "feat/human-fallback-voice", "fix/compact-reviewed-inference", main, hardening/secret-history-guard, "quality/product-reality-evidence"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable history without printing values
        run: /tmp/gitleaks git --log-opts="--all --full-history" --ignore-gitleaks-allow --redact=100 --no-banner .
