# .github/workflows/backend-ci.yml

name: Backend CI

on:
  push:
    branches: ["main", "hardening/pg19-dev-bootstrap", "research/object-storage-trial", "hardening/traefik-docker-api", "hardening/dev-proxy-routes", "hardening/meta-confidence-boundaries", "hardening/feature-assignment-contracts", "hardening/bounded-text-inference", "hardening/notification-results", "hardening/notification-endpoints", "hardening/support-session-isolation", "hardening/support-action-truth", "hardening/support-inference-deadline", "hardening/behavior-offline-training", "hardening/push-subscription-contract", "hardening/ci-search-disk-budget", "hardening/cache-failure-privacy", "hardening/voice-real-transport", "hardening/remove-orphan-drone-compliance", "hardening/voice-command-truth", "hardening/root-entrypoints", "hardening/remove-root-editor-artifacts", "hardening/remove-stale-schema-dumps", "hardening/milvus-schema-diagnostics", "hardening/empty-milvus-rating-repair", "hardening/seeder-explicit-cache", "hardening/embedding-startup-readiness", "hardening/recommendation-live-facts", "hardening/cart-command-invariants"]
    paths:
      - 'apps/api/**'
      - 'Makefile'
      - 'dev-auto-watch.sh'
      - 'scripts/configure_dev_env.py'
      - 'scripts/verify_traefik_docker.py'
      - 'scripts/backup_dev_db.sh'
      - 'docker-compose*.yml'
      - '.env.dev.example'
      - 'infra/postgres-backup/**'
      - 'infra/minio-ce/**'
      - 'infra/storage-ci/**'
      - 'infra/s3/**'
      - 'infra/k8s/10-milvus.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/api/**'
      - 'Makefile'
      - 'dev-auto-watch.sh'
      - 'scripts/configure_dev_env.py'
      - 'scripts/verify_traefik_docker.py'
      - 'scripts/backup_dev_db.sh'
      - 'docker-compose*.yml'
      - '.env.dev.example'
      - 'infra/postgres-backup/**'
      - 'infra/minio-ce/**'
      - 'infra/storage-ci/**'
      - 'infra/s3/**'
      - 'infra/k8s/10-milvus.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [rustfs, seaweed]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg19-bookworm@sha256:89879f41d564f67b0c1462a491d16fcbc6de39ac10db17e7a4bba2138a5e0ba5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airdeliver_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airdeliver_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/airdeliver_test_ci
      TEST_DOCKER_ENGINE: "1"
      TEST_OBJECT_STORAGE_BACKEND: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        working-directory: apps/api
        run: poetry install

      - name: Build PostgreSQL 19 backup and restore image
        run: docker build -t airdeliver-postgres-backup:ci infra/postgres-backup

      - name: Migrate PostgreSQL 19 and run tests
        working-directory: apps/api
        env:
          TEST_PG_BACKUP_IMAGE: airdeliver-postgres-backup:ci
          AIRDELIVER_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: poetry run python scripts/verify_postgres_integration.py

      - name: Reclaim disposable CI download and build caches
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          df -h /
          # These preinstalled mobile/.NET SDKs are unused by this Python/Node job.
          # Only disposable hosted runners, never self-hosted or developer machines.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          # Installed environments and running services are not cache artifacts.
          # Keep all images, containers and volumes. Never relax disk watermarks.
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          for path in (Path.home()/'.cache/pypoetry/artifacts', Path.home()/'.cache/pip'):
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
          PYTHON
          docker builder prune --all --force
          df -h /

      - name: Verify seeder with real search services and learned embeddings
        working-directory: apps/api
        timeout-minutes: 10
        run: |
          sudo sysctl -w vm.max_map_count=262144
          poetry run python scripts/verify_seed_search_integration.py

      - name: Verify current Traefik Docker API negotiation and real HTTP route
        if: matrix.storage == 'rustfs'
        timeout-minutes: 3
        run: python scripts/verify_traefik_docker.py
