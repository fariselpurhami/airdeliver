# Disposable CI dependencies only. No user volumes, credentials, or public ports.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    mem_limit: 512m
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    user: '0:0'
    command: [server, /data]
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: 'false'
    mem_limit: 1536m
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 48
  milvus:
    image: milvusdb/milvus:v2.6.17
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_USESSL: 'false'
      MINIO_USEIAM: 'false'
      MINIO_REGION: us-east-1
      MINIO_BUCKETNAME: airdeliver-ci
      MINIO_ROOTPATH: milvus
      MINIO_USEVIRTUALHOST: 'false'
    mem_limit: 2560m
    ports:
      - '127.0.0.1::19530'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 5s
      timeout: 5s
      retries: 48
      start_period: 10s
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - '127.0.0.1::9200'
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9200]
      interval: 5s
      timeout: 5s
      retries: 48
      start_period: 10s
