# docker-compose.dev.yml

services:
  web:
    volumes:
      - ./apps/web:/app
      - /app/node_modules 
      - /app/.next

    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development

  api:
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug 

  c2_gateway:
    volumes:
      - ./apps/c2-gateway:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
