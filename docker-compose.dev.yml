# docker-compose.dev.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-deploy-core: &default-core-deploy
  restart_policy:
    condition: on-failure
    delay: 5s
    window: 120s
  resources:
    limits:
      memory: 2G
    reservations:
      memory: 512M

x-deploy-app: &default-app-deploy
  restart_policy:
    condition: on-failure
    delay: 5s
    window: 120s
  resources:
    limits:
      memory: 1G
    reservations:
      memory: 256M

services:
  setup-fs:
    image: alpine:3.19
    container_name: airdeliver-setup-fs
    user: root
    command: >
      sh -c "
      mkdir -p /data/storage/models_cache/huggingface &&
      mkdir -p /data/storage/models_cache/sentence_transformers &&
      chown -R 1001:1001 /data/storage
      "
    volumes:
      - ./data/storage:/data/storage
    logging: *default-logging

  reverse-proxy:
    image: traefik:v3.0
    container_name: airdeliver-reverse-proxy
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public-net
    logging: *default-logging

  postgres:
    image: postgres:16-bullseye
    container_name: airdeliver-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airdeliver}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=4MB
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airdeliver}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy: *default-core-deploy

  redis:
    image: redis:7-bullseye
    container_name: airdeliver-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    deploy: *default-core-deploy

  mq:
    image: rabbitmq:3.13-management
    container_name: airdeliver-mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    networks:
      - backend-net
      - simulation-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging
    deploy: *default-core-deploy

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy: *default-core-deploy

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: airdeliver-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - backend-net
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: airdeliver-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.3.13
    container_name: airdeliver-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URI=${DATABASE_URL_SYNC}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    deploy: *default-app-deploy
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/pyproject.toml

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    restart: always
    stop_grace_period: 30s
    environment:
      - DATABASE_URI=${DATABASE_URL_ASYNC}
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - APP_ENV=development
      - LOG_LEVEL=info
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MILVUS_URI=http://milvus:19530
      - EMBEDDING_MODEL_PATH=/data/storage/models_cache/sentence_transformers/all-MiniLM-L6-v2
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/api-static-data:/app/static
    depends_on:
      api-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - public-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 10s
       timeout: 5s
       retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging: *default-logging
    deploy: *default-app-deploy
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/pyproject.toml
        - action: rebuild
          path: ./apps/api/poetry.lock

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    user: airdeliver
    restart: always
    stop_grace_period: 30s
    environment:
      - DATABASE_URI=${DATABASE_URL_ASYNC}
      - POSTGRES_SERVER=postgres
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MILVUS_URI=http://milvus:19530
      - HF_HOME=/data/storage/models_cache/huggingface
      - EMBEDDING_MODEL_PATH=/data/storage/models_cache/sentence_transformers/all-MiniLM-L6-v2
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/data/storage:/data/storage
    depends_on:
      setup-fs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks:
      - backend-net
    command: >
      sh -c "/opt/venv/bin/watchfiles '/opt/venv/bin/python /app/worker_entrypoint.py' /app --ignore-paths '*/__pycache__'"
    logging: *default-logging
    deploy: *default-app-deploy
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/pyproject.toml
        - action: rebuild
          path: ./apps/api/poetry.lock

  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    env_file: .env
    restart: always
    environment:
      - RABBITMQ_HOST=mq
      - API_BASE_URL=http://api:8000/api/v1
    volumes:
      - ./apps/c2-gateway:/app:delegated
    depends_on:
      mq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend-net
      - simulation-net
      - public-net
    ports:
       - "8001:8001"
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    logging: *default-logging
    deploy: *default-app-deploy
    develop:
      watch:
        - action: rebuild
          path: ./apps/c2-gateway/pyproject.toml
        - action: rebuild
          path: ./apps/c2-gateway/poetry.lock

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - HOSTNAME=0.0.0.0
    volumes:
      - ./apps/web:/app:delegated
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    ports:
        - "3000:3000"
    networks:
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`localhost`)"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    command: pnpm dev -H 0.0.0.0 -p 3000
    logging: *default-logging
    deploy: *default-app-deploy
    develop:
      watch:
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/pnpm-lock.yaml

  px4-sitl:
    container_name: airdeliver-px4-sitl
    build:
      context: ./docker/px4-sitl
      dockerfile: Dockerfile
    networks:
      - simulation-net
    environment:
      - PX4_SIM_SPEED_FACTOR=1
      - PX4_HOME_LAT=30.0444
      - PX4_HOME_LON=31.2357
      - PX4_HOME_ALT=100
    volumes:
      - px4-source-data:/root/PX4-Autopilot
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x px4 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  opensearch-data:
  api-static-data:
  etcd-data:
  minio-data:
  milvus-data:
  px4-source-data:
    driver: local

networks:
  public-net:
    driver: bridge
    name: airdeliver-public   
  backend-net:
    driver: bridge
    internal: true
    name: airdeliver-backend
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  simulation-net:
    driver: bridge
    name: airdeliver-simulation
