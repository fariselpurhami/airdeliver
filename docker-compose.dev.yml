services:
  setup-fs:
    image: alpine:3.19
    container_name: airdeliver-setup-fs
    user: root
    command: |
      sh -c "
        mkdir -p /data/storage/models_cache/huggingface &&
        mkdir -p /data/storage/models_cache/sentence_transformers &&
        chmod -R 777 /data/storage
      "
    volumes:
      - ./data/storage:/data/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    container_name: airdeliver-reverse-proxy
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:0.8.7-pg19-bookworm@sha256:89879f41d564f67b0c1462a491d16fcbc6de39ac10db17e7a4bba2138a5e0ba5
    container_name: airdeliver-db
    restart: always
    # Replace the old mount list, never attach a PG16 data directory to PG19.
    volumes: !override
      - postgres19-data:/var/lib/postgresql
      - ./db_init/01-enable-vector.sql:/docker-entrypoint-initdb.d/01-enable-vector.sql:ro
    command: postgres -c shared_buffers=256MB -c effective_cache_size=1536MB -c work_mem=16MB -c maintenance_work_mem=128MB
    ports:
      - "5432:5432"
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airdeliver}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  redis:
    image: redis:7-bullseye
    container_name: airdeliver-redis
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  mq:
    image: rabbitmq:3.13-management
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: airdeliver-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Compatibility service name only. The server is RustFS, NOT MinIO.
  minio:
    profiles: !reset []
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    pull_policy: missing
    container_name: airdeliver-minio
    restart: unless-stopped
    user: '0:0'
    command: [server, /data]
    environment: !override
      RUSTFS_ACCESS_KEY: ${DEV_S3_ACCESS_KEY:-airdeliver-local}
      RUSTFS_SECRET_KEY: ${DEV_S3_SECRET_KEY:-local-development-only-change-me}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes: !override
      - rustfs-data:/data
    networks:
      - global-net
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 48
    deploy:
      restart_policy: !reset null
      resources:
        limits:
          memory: 1536M

  milvus:
    entrypoint: !reset null
    image: milvusdb/milvus:v2.6.17
    container_name: airdeliver-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY:-airdeliver-local}
      MINIO_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_KEY:-local-development-only-change-me}
      MINIO_USESSL: "false"
      MINIO_USEIAM: "false"
      MINIO_CLOUDPROVIDER: aws
      MINIO_REGION: us-east-1
      MINIO_BUCKETNAME: airdeliver-dev
      MINIO_ROOTPATH: milvus
      MINIO_USEVIRTUALHOST: "false"
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on: !override
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 512M

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: ${AIRDELIVER_ENV_FILE:-.env}
    environment:
      - APP_ENV=development
      - DATABASE_URI=${DATABASE_URL_ASYNC}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global-net
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: ${AIRDELIVER_ENV_FILE:-.env}
    restart: always
    stop_grace_period: 10s
    dns:
      - 8.8.8.8        
      - 1.1.1.1
    environment:
      - GROQ_SUPPORT_MODEL=${GROQ_SUPPORT_MODEL:-openai/gpt-oss-120b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - APP_ENV=development
      - CUSTOMER_MEMORY_ENABLED=${CUSTOMER_MEMORY_ENABLED:-true}
      - LOG_LEVEL=info
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - HF_HOME=/data/storage/models_cache/huggingface
      - HF_HUB_CACHE=/data/storage/models_cache/huggingface/hub
      - TRANSFORMERS_CACHE=/data/storage/models_cache/huggingface/transformers
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - MILVUS_URI=http://milvus:19530
      - TEXT_WARMUP_BUDGET_SECONDS=${TEXT_WARMUP_BUDGET_SECONDS:-1200}
      - TEXT_STARTUP_BUDGET_SECONDS=${TEXT_STARTUP_BUDGET_SECONDS:-1500}
      - TEXT_WARMUP_SAMPLE_MAX_SECONDS=${TEXT_WARMUP_SAMPLE_MAX_SECONDS:-5}
      - AI_RECOVERY_INTERVAL_SECONDS=${AI_RECOVERY_INTERVAL_SECONDS:-30}
      - EMBEDDING_MODEL_PATH=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_TOKEN=${HF_TOKEN}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - EMBEDDING_MODEL_REVISION=main
      - HF_HUB_DISABLE_DOWNLOAD_PROGRESS=1

    volumes:
      - ./apps/api:/app:delegated
      - api-static-data:/app/static
      - ${PWD}/data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 5s
       timeout: 5s
       retries: 20
       start_period: 390s
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    command: /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws-ping-interval 20 --ws-ping-timeout 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: airdeliver
    restart: always
    stop_grace_period: 60s
    env_file: ${AIRDELIVER_ENV_FILE:-.env}
    environment:
      - GROQ_SUPPORT_MODEL=${GROQ_SUPPORT_MODEL:-openai/gpt-oss-120b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com}
      - APP_ENV=development
      - CUSTOMER_MEMORY_ENABLED=${CUSTOMER_MEMORY_ENABLED:-true}
      - DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - VOICE_MODEL_PATH=/data/storage/models_cache/huggingface/personaplex-7b-v1
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MILVUS_URI=http://milvus:19530
      - HF_HOME=/data/storage/models_cache/huggingface
      - TEXT_WARMUP_BUDGET_SECONDS=${TEXT_WARMUP_BUDGET_SECONDS:-1200}
      - TEXT_STARTUP_BUDGET_SECONDS=${TEXT_STARTUP_BUDGET_SECONDS:-1500}
      - TEXT_WARMUP_SAMPLE_MAX_SECONDS=${TEXT_WARMUP_SAMPLE_MAX_SECONDS:-5}
      - AI_RECOVERY_INTERVAL_SECONDS=${AI_RECOVERY_INTERVAL_SECONDS:-30}
      - EMBEDDING_MODEL_PATH=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - PYTORCH_ENABLE_MPS_FALLBACK=0
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_TOKEN=${HF_TOKEN}
      - EMBEDDING_MODEL_REVISION=main
      - HF_HUB_DISABLE_DOWNLOAD_PROGRESS=1
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets
      - HF_HUB_CACHE=/data/storage/models_cache/huggingface/hub
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets

    shm_size: '2gb'
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/data/storage:/data/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - global-net
    command: >
      sh -c "
      echo '🚀 Starting Optimized Worker...' &&
      /opt/venv/bin/watchfiles '/opt/venv/bin/python /app/worker_entrypoint.py' /app --ignore-paths '*/__pycache__'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 1G

  api-seeder:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: airdeliver-seeder
    command: /opt/venv/bin/python /app/seed_ultra_scale.py
    env_file: ${AIRDELIVER_ENV_FILE:-.env}
    environment:
      - SEED_TARGET_COUNT=${SEED_TARGET_COUNT:-1000}
      - SEED_BATCH_SIZE=${SEED_BATCH_SIZE:-16}
      - SEED_RANDOM_SEED=${SEED_RANDOM_SEED:-20260514}
      - EMBEDDING_ENCODE_BATCH_SIZE=${EMBEDDING_ENCODE_BATCH_SIZE:-1}
      - SEED_EMBEDDING_THREADS=2
      - SEED_EMBEDDING_MAX_SEQ_LENGTH=256
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_MAX_OVERFLOW=0
      - OMP_NUM_THREADS=2
      - APP_ENV=development
      - DATABASE_URI=${DATABASE_URL_ASYNC}
      - POSTGRES_SERVER=postgres
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASS=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_USE_SSL=false
      - MILVUS_URI=http://milvus:19530
      - MILVUS_ENABLED=${SEED_MILVUS_ENABLED:-true}
      - OPENSEARCH_ENABLED=${SEED_OPENSEARCH_ENABLED:-true}
      - PRODUCT_TEXT_MODEL_REVISION=${PRODUCT_TEXT_MODEL_REVISION:-}
      - EMBEDDING_MODEL=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/data/storage/models_cache/huggingface
      # Pin library-specific overrides too: env_file values otherwise escape
      # the shared bind mount and vanish with a tools run --rm container.
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - HF_HUB_CACHE=/data/storage/models_cache/huggingface/hub
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/data/storage:/data/storage
    networks:
      - global-net
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    mem_limit: 8g
    cpus: 2
    restart: "no"
    profiles: ["tools"]

  # No production monitoring router/certificate configuration on local HTTP.
  grafana:
    labels: !override
      - "traefik.enable=false"

  web:
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
      args:
        - NEXT_PUBLIC_API_URL=http://${HOST_IP}/api
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
     - AUTH_URL=${AUTH_URL:-http://127.0.0.1:3000}
     - NEXTAUTH_URL=${AUTH_URL:-http://127.0.0.1:3000}
     - NEXT_PUBLIC_API_URL=/api/v1
     - API_URL=http://api:8000/api/v1
     - AUTH_SECRET=${AUTH_SECRET}
     - AUTH_TRUST_HOST=true
     - NODE_ENV=development
     - HOSTNAME=0.0.0.0
     - NEXT_TELEMETRY_DISABLED=1
     - PNPM_HOME=/pnpm
     - PATH=/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
     - WATCHPACK_POLLING=true
     - CI=true
     - PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
     - PNPM_CONFIG_ALLOW_BUILD=esbuild,sharp,unrs-resolver
     - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
     - PNPM_CONFIG_MINIMUM_RELEASE_AGE=0
     - PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false
     - NPM_CONFIG_MINIMUM_RELEASE_AGE=0
    volumes:
      - ./apps/web:/app:delegated
      - pnpm-store:/pnpm
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    ports:
        - "3000:3000"
    networks:
        - global-net
    command: node scripts/dev-lan.mjs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
        reservations:
          memory: 1G

volumes:
  postgres19-data:
    name: ${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}_postgres19-data}
  postgres-data:
  rabbitmq-data:
    name: ${AIRDELIVER_DEV_RABBITMQ_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}_rabbitmq-data}
  redis-data:
    name: ${AIRDELIVER_DEV_REDIS_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_redis-data}
  opensearch-data:
    name: ${AIRDELIVER_DEV_OPENSEARCH_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_opensearch-data}
  api-static-data:
  etcd-data:
    name: ${AIRDELIVER_DEV_RUSTFS_ETCD_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_rustfs_v1_etcd-data}
  rustfs-data:
    name: ${AIRDELIVER_DEV_RUSTFS_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_rustfs_v1_data}
  minio-data:
    name: ${AIRDELIVER_DEV_MINIO_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_minio-data}
  milvus-data:
    name: ${AIRDELIVER_DEV_RUSTFS_MILVUS_VOLUME:-${AIRDELIVER_DEV_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-airdeliver_dev}}_rustfs_v1_milvus-data}
  px4-source-data:
    driver: local
  pnpm-store:             
    driver: local
  web_build_cache:
  huggingface-cache:
  sentence-transformers-cache:
  caddy-data:
  caddy-config:

networks:
  global-net:
    name: airdeliver-global-net
    external: true

# Local copies preserve the existing credential values. Production continues to
# use its original secrets/ paths when this dev override is not supplied.
secrets:
  postgres_user:
    file: ${AIRDELIVER_DEV_SECRET_DIR:-./secrets}/postgres_user
  postgres_password:
    file: ${AIRDELIVER_DEV_SECRET_DIR:-./secrets}/postgres_password
  postgres_db:
    file: ${AIRDELIVER_DEV_SECRET_DIR:-./secrets}/postgres_db
  rabbitmq_user:
    file: ${AIRDELIVER_DEV_SECRET_DIR:-./secrets}/rabbitmq_user
  rabbitmq_pass:
    file: ${AIRDELIVER_DEV_SECRET_DIR:-./secrets}/rabbitmq_pass
