services:
  setup-fs:
    image: alpine:3.19
    container_name: airdeliver-setup-fs
    user: root
    command: |
      sh -c "
        mkdir -p /data/storage/models_cache/huggingface &&
        mkdir -p /data/storage/models_cache/sentence_transformers &&
        chmod -R 777 /data/storage
      "
    volumes:
      - ./data/storage:/data/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    image: traefik:v3.0
    container_name: airdeliver-reverse-proxy
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: airdeliver-db
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db_init/01-enable-vector.sql:/docker-entrypoint-initdb.d/01-enable-vector.sql
    command: postgres -c shared_buffers=256MB -c effective_cache_size=1536MB -c work_mem=16MB -c maintenance_work_mem=128MB
    ports:
      - "5432:5432"
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airdeliver}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  redis:
    image: redis:7-bullseye
    container_name: airdeliver-redis
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  mq:
    image: rabbitmq:3.13-management
    container_name: airdeliver-mq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: airdeliver-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: airdeliver-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - global-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: airdeliver-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  milvus:
    image: milvusdb/milvus:v2.6.17
    container_name: airdeliver-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 512M

  api-migrator:
    container_name: airdeliver-api-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URI=${DATABASE_URL_SYNC}    
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.initial_data"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global-net
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    container_name: airdeliver-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    restart: always
    stop_grace_period: 10s
    dns:
      - 8.8.8.8        
      - 1.1.1.1
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - APP_ENV=development
      - LOG_LEVEL=info
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - HF_HOME=/data/storage/models_cache/huggingface
      - HF_HUB_CACHE=/data/storage/models_cache/huggingface/hub
      - TRANSFORMERS_CACHE=/data/storage/models_cache/huggingface/transformers
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - MILVUS_URI=http://milvus:19530
      - EMBEDDING_MODEL_PATH=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_TOKEN=${HF_TOKEN}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - EMBEDDING_MODEL_REVISION=main
      - HF_HUB_DISABLE_DOWNLOAD_PROGRESS=1

    volumes:
      - ./apps/api:/app:delegated
      - api-static-data:/app/static
      - ${PWD}/data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - global-net
    healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
       interval: 5s
       timeout: 5s
       retries: 20
       start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=(Host(`localhost`) || Host(`${HOST_IP}`)) && PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    command: /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 11G
        reservations:
          memory: 512M

  api-worker:
    container_name: airdeliver-api-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: airdeliver
    restart: always
    stop_grace_period: 60s
    env_file: .env
    environment:
      - DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - SENTENCE_TRANSFORMERS_HOME=/data/storage/models_cache/sentence_transformers
      - VOICE_MODEL_PATH=/data/storage/models_cache/huggingface/personaplex-7b-v1
      - RABBITMQ_HOST=mq
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MILVUS_URI=http://milvus:19530
      - HF_HOME=/data/storage/models_cache/huggingface
      - EMBEDDING_MODEL_PATH=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - PYTORCH_ENABLE_MPS_FALLBACK=0
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_TOKEN=${HF_TOKEN}
      - EMBEDDING_MODEL_REVISION=main
      - HF_HUB_DISABLE_DOWNLOAD_PROGRESS=1
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets
      - HF_HUB_CACHE=/data/storage/models_cache/huggingface/hub
      - HF_DATASETS_CACHE=/data/storage/models_cache/huggingface/datasets

    shm_size: '2gb'
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/data/storage:/data/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - global-net
    command: >
      sh -c "
      echo '🚀 Starting Optimized Worker...' &&
      /opt/venv/bin/watchfiles '/opt/venv/bin/python /app/worker_entrypoint.py' /app --ignore-paths '*/__pycache__'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 7.9G
        reservations:
          memory: 2G

  api-seeder:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: airdeliver-seeder
    command: /opt/venv/bin/python /app/seed_ultra_scale.py
    env_file: .env
    environment:
      - SEED_TARGET_COUNT=1000
      - SEED_BATCH_SIZE=64
      - OMP_NUM_THREADS=4
      - APP_ENV=development
      - DATABASE_URI=${DATABASE_URL_ASYNC}
      - POSTGRES_SERVER=postgres
      - OPENSEARCH_HOST=opensearch
      - REDIS_URL=redis://redis:6379/0
      - EMBEDDING_MODEL_PATH=Alibaba-NLP/gte-Qwen2-1.5B-instruct
      - OMP_NUM_THREADS=4
      - HF_HOME=/data/storage/models_cache/huggingface
    volumes:
      - ./apps/api:/app:delegated
      - ${PWD}/data/storage:/data/storage
    network_mode: service:api
    user: root
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  web:
    container_name: airdeliver-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
      args:
        - NEXT_PUBLIC_API_URL=http://${HOST_IP}/api
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: always
    environment:
     - AUTH_URL=http://${HOST_IP}:3000
     - AUTH_SECRET=${AUTH_SECRET}
     - AUTH_TRUST_HOST=true
     - NODE_ENV=development
     - HOSTNAME=0.0.0.0
     - NEXT_TELEMETRY_DISABLED=1
     - PNPM_HOME=/pnpm
     - PATH=/pnpm:$PATH
     - WATCHPACK_POLLING=true
     - CI=true
     - PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
     - PNPM_CONFIG_ALLOW_BUILD=esbuild,sharp,unrs-resolver
     - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
     - PNPM_CONFIG_MINIMUM_RELEASE_AGE=0
     - PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false
     - NPM_CONFIG_MINIMUM_RELEASE_AGE=0
    volumes:
      - ./apps/web:/app:delegated
      - pnpm-store:/pnpm
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    ports:
        - "3000:3000"
    networks:
        - global-net
    command: pnpm dev --turbo --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G
        reservations:
          memory: 1G

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  opensearch-data:
  api-static-data:
  etcd-data:
  minio-data:
  milvus-data:
  px4-source-data:
    driver: local
  pnpm-store:             
    driver: local
  web_build_cache:
  huggingface-cache:
  sentence-transformers-cache:
  caddy-data:
  caddy-config:

networks:
  global-net:
    name: airdeliver-global-net
    external: true
