# docker-compose.drone.yml

services:
  px4-sitl:
    container_name: airdeliver-px4-sitl
    build:
      context: ./docker/px4-sitl
      dockerfile: Dockerfile
    networks:
      - airdeliver-net
    environment:
      - PX4_SIM_SPEED_FACTOR=1
      - PX4_HOME_LAT=30.0444
      - PX4_HOME_LON=31.2357
      - PX4_HOME_ALT=100
    volumes:
      - px4-source-data:/root/PX4-Autopilot
    deploy:
      resources:
        limits:
          memory: 8192m
        reservations:
          memory: 4096m
    healthcheck:
      test: ["CMD-SHELL", "netstat -upln | grep 14540 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  companion:
    container_name: airdeliver-companion-sim
    build:
      context: ./drone_client
      dockerfile: Dockerfile
    environment:
      - DRONE_ID=SIM-001
      - WEBSOCKET_URI=ws://c2_gateway:8001/drones/SIM-001
      - MAVLINK_CONNECTION=udp:px4-sitl:14540
      - AUTH_TOKEN_FILE=/run/secrets/drone_auth_token
    secrets:
      - drone_auth_token
    networks:
      - airdeliver-net
    depends_on:
      px4-sitl:
        condition: service_healthy
      c2_gateway:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  px4-source-data:
    driver: local
