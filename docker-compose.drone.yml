# file: docker-compose.drone.yml

services:
  px4-sitl:
    container_name: airdeliver-px4-sitl
    build:
      context: ./drone-simulator 
      dockerfile: Dockerfile
    ports:
      - "14540:14540/udp"
      - "14550:14550/udp" 
      - "14556:14556/udp"
      
    networks:
      - airdeliver-net
    environment:
      - PX4_SIM_SPEED_FACTOR=1 
   
  companion:
    container_name: airdeliver-companion-sim
    build:
      context: ./drone_client 
      dockerfile: Dockerfile
    environment:
      - DRONE_ID=SIM-001 
      - WEBSOCKET_URI=ws://api:8000/ws/drones/ 
      - MAVLINK_CONNECTION=udp://px4-sitl:14540 
      - AUTH_TOKEN=your_secure_token_sim 
    networks:
      - airdeliver-net
    depends_on:
      - px4-sitl
      - api 
    restart: unless-stopped 

networks:
  airdeliver-net: 
