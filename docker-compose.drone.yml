# docker-compose.drone.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  px4-sitl:
    container_name: airdeliver-px4-sitl
    build:
      context: ./docker/px4-sitl
      dockerfile: Dockerfile
    user: root
    networks:
      - global-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PX4_SIM_SPEED_FACTOR=1
      - MAVLINK_UDP_HOST=192.168.65.2
      - PX4_HOME_LAT=30.0444
      - PX4_HOME_LON=31.2357
      - PX4_HOME_ALT=100
    volumes:
      - px4-source-data:/root/PX4-Autopilot
    restart: on-failure
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    ports:
      - "14540:14540"

  mavlink-router:
    build:
      context: ./infrastructure/router
      dockerfile: Dockerfile
    container_name: mavlink-router
    network_mode: service:px4-sitl
    depends_on:
      - px4-sitl
    restart: always


  c2_gateway:
    container_name: airdeliver-c2-gateway
    build:
      context: ./apps/c2-gateway
      dockerfile: Dockerfile
    env_file: .env
    restart: always
    environment:
      - RABBITMQ_HOST=mq 
      - API_BASE_URL=http://api:8000/api/v1
    volumes:
      - ./apps/c2-gateway:/app:delegated
      - poetry-cache:/opt/venv
    networks:
      - global-net
    ports:
       - "8001:8001"
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    logging: *default-logging
    deploy:
        resources:
            limits:
                memory: 512M

  companion:
    container_name: airdeliver-companion-sim
    build:
      context: ./drone_client
      dockerfile: Dockerfile
    environment:
      - DRONE_ID=${DRONE_ID:-SIM-001}
      - WEBSOCKET_URI=${WEBSOCKET_URI:-ws://c2_gateway:8001/drones/SIM-001}
      - MAVLINK_CONNECTION=udp:px4-sitl:14540
      - AUTH_TOKEN_FILE=/run/secrets/drone_auth_token
    secrets:
      - drone_auth_token
    depends_on:
      - c2_gateway
      - px4-sitl
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python drone-control.py' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    stdin_open: true
    tty: true
    develop:
      watch:
        - action: sync
          path: ./drone_client
          target: /app
          ignore:
            - ./drone_client/__pycache__
            - ./drone_client/.venv
        - action: rebuild
          path: ./drone_client/requirements.txt

volumes:
  px4-source-data:
    driver: local
  poetry-cache:

networks:
  global-net:
    name: airdeliver-global-net
    external: true

secrets:
  drone_auth_token:
    file: ./secrets/drone_auth_token
