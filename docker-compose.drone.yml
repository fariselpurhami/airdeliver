# docker-compose.drone.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-deploy-client: &default-client-deploy
  restart_policy:
    condition: any
    delay: 5s
    window: 120s
  resources:
    limits:
      cpus: '1.0'
      memory: 1G
    reservations:
      cpus: '0.25'
      memory: 256M

services:
  companion:
    container_name: airdeliver-companion-sim
    build:
      context: ./drone_client
      dockerfile: Dockerfile
    environment:
      - DRONE_ID=SIM-001
      - WEBSOCKET_URI=ws://c2_gateway:8001/drones/SIM-001
      - MAVLINK_CONNECTION=udp:px4-sitl:14540
      - AUTH_TOKEN_FILE=/run/secrets/drone_auth_token
    secrets:
      - drone_auth_token
    networks:
      - simulation-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python drone-control.py' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy: *default-client-deploy
    stdin_open: true
    tty: true

networks:
  simulation-net:
    external: true
    name: airdeliver-simulation

secrets:
  drone_auth_token:
    file: ./secrets/drone_auth_token
