# docker-compose.drone.yml

services:
  px4-sitl:
    container_name: airdeliver-px4-sitl
    build:
      context: ./apps/drone-simulator
      dockerfile: Dockerfile
    ports:
      - "14540:14540/udp"
      - "14550:14550/udp" 
      - "14556:14556/udp"
    networks:
      - airdeliver-net
    environment:
      - PX4_SIM_SPEED_FACTOR=1 
   
  companion:
    container_name: airdeliver-companion-sim
    build:
      context: ./drone_client 
      dockerfile: Dockerfile
    environment:
      - DRONE_ID=SIM-001 
      - WEBSOCKET_URI=ws://c2_gateway:8001/ws/connect/
      - MAVLINK_CONNECTION=udp://px4-sitl:14540 
      - AUTH_TOKEN=${DRONE_AUTH_TOKEN}
    networks:
      - airdeliver-net
    depends_on:
      - px4-sitl
      - c2_gateway
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  airdeliver-net:
    external: true
